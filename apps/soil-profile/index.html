<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Clay strength profile explorer</title>
<style>body{margin:0;background:#f4faf9;color:#123849;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}.wrapper{padding:22px;max-width:890px;margin:auto}.head{display:flex;justify-content:space-between;gap:20px;align-items:start}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#087c78}h1{margin:4px 0 8px;font-size:21px}p{color:#466370;margin:0 0 16px;font-size:13px}.inputs{display:flex;gap:25px;flex-wrap:wrap;background:#fff;padding:14px 18px;border:1px solid #dce8e8;border-radius:10px}label{flex:1;font-weight:650;font-size:12px;min-width:150px}input{display:block;width:100%;margin-top:10px;accent-color:#087c78}.value{font-size:19px;color:#087c78}svg{display:block;background:white;border:1px solid #dce8e8;width:100%;max-height:380px;border-radius:10px;margin-top:15px}.note{margin:14px 0;font-size:12px;color:#4a6572}@media(max-width:600px){.wrapper{padding:13px}svg{max-height:310px}}</style></head><body>
<div class="wrapper"><div class="head"><div><span class="eyebrow">Interactive Geo App · Conceptual example</span><h1>Undrained shear strength profile</h1><p>Clay model: sᵤ(z) = k × z. Change the gradient and penetration depth.</p></div></div>
<div class="inputs"><label>Gradient k: <span class="value" id="kvalue">3.0</span> kPa/m<input aria-label="Undrained strength gradient in kilopascals per metre" type="range" id="gradient" min="0.5" max="8" step="0.5" value="3"></label>
<label>Maximum depth: <span class="value" id="dvalue">30</span> m<input aria-label="Maximum depth in metres" type="range" id="depth" min="10" max="60" step="5" value="30"></label></div>
<svg id="chart" viewBox="0 0 720 335" role="img" aria-label="Interactive graph of undrained strength increasing with depth"><title>Clay strength profile</title></svg>
<div class="note"><strong id="summary"></strong> · Synthetic mathematical profile only. No anchoring resistance, stratigraphy or site-specific calibration is inferred.</div></div>
<script>
(()=>{
const g=document.getElementById('gradient'),d=document.getElementById('depth'),s=document.getElementById('chart');const ns='http://www.w3.org/2000/svg';
function el(tag,attrs,text){const n=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs||{}))n.setAttribute(k,v);if(text!=null)n.textContent=text;s.appendChild(n);return n}
function draw(){const k=Number(g.value),maxD=Number(d.value),maxS=k*maxD;document.getElementById('kvalue').textContent=k.toFixed(1);document.getElementById('dvalue').textContent=maxD;document.getElementById('summary').textContent=`At ${maxD} m: sᵤ = ${maxS.toFixed(1)} kPa`;
s.replaceChildren();const left=72,top=25,w=590,h=245;for(let i=0;i<=5;i++){let x=left+i*w/5;el('line',{x1:x,y1:top,x2:x,y2:top+h,stroke:'#e7eeef','stroke-width':'1'});el('text',{x:x,y:top+h+22,'text-anchor':'middle','font-size':12,fill:'#577581'},(maxS*i/5).toFixed(0))}for(let i=0;i<=5;i++){let y=top+i*h/5;el('line',{x1:left,y1:y,x2:left+w,y2:y,stroke:'#e7eeef','stroke-width':'1'});el('text',{x:left-12,y:y+4,'text-anchor':'end','font-size':12,fill:'#577581'},(maxD*i/5).toFixed(0))}
el('path',{d:`M${left} ${top}L${left+w} ${top+h}`,stroke:'#087c78','stroke-width':4,fill:'none','stroke-linecap':'round'});el('circle',{cx:left+w,cy:top+h,r:5,fill:'#087c78'});el('text',{x:left+w/2,y:top+h+49,'text-anchor':'middle','font-size':13,fill:'#1a4757'},'Undrained strength sᵤ [kPa]');el('text',{x:20,y:top+h/2,'text-anchor':'middle',transform:`rotate(-90 20 ${top+h/2})`,'font-size':13,fill:'#1a4757'},'Depth z [m]')}
g.addEventListener('input',draw);d.addEventListener('input',draw);draw()})();
</script></body></html>
